apiVersion: v1
kind: ConfigMap
metadata:
  name: reptrack-hosts-config
  namespace: reptrack
data:
  zz_hosts.rb: |
    Rails.application.config.assume_ssl = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reptrack
  namespace: reptrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reptrack
  template:
    metadata:
      labels:
        app: reptrack
    spec:
      imagePullSecrets:
        - name: dockerhub-key
      containers:
        - name: reptrack
          image: moindev/reptrack:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: reptrack-secrets
          env:
            - name: RAILS_ENV
              value: "staging"
            - name: SMTP_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: ses-credentials
                  key: SMTP_ADDRESS
            - name: SMTP_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: ses-credentials
                  key: SMTP_USER_NAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ses-credentials
                  key: SMTP_PASSWORD
            - name: AR_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: encryption-keys
                  key: AR_ENCRYPTION_PRIMARY_KEY
            - name: AR_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: encryption-keys
                  key: AR_ENCRYPTION_DETERMINISTIC_KEY
            - name: AR_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: encryption-keys
                  key: AR_ENCRYPTION_KEY_DERIVATION_SALT
          volumeMounts:
            - name: hosts-config
              mountPath: /rails/config/initializers/zz_hosts.rb
              subPath: zz_hosts.rb
              readOnly: true
      volumes:
        - name: hosts-config
          configMap:
            name: reptrack-hosts-config
---
apiVersion: v1
kind: Service
metadata:
  name: reptrack-service
  namespace: reptrack          # ← fixed: was "practify"
spec:
  selector:
    app: reptrack
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001         # ← fixed: was 3001, should match containerPort
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: staging-root-redirect
  namespace: reptrack
spec:
  replacePathRegex:
    regex: ^/$
    replacement: /up
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reptrack-ingress
  namespace: reptrack
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: reptrack.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reptrack-service  # ← fixed: was "practify-service"
                port:
                  number: 80
    - host: www.reptrack.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reptrack-service
                port:
                  number: 80    
---
# Every tenant subdomain (*.reptrack.co.in) routes to staging for now — there
# are no live prod tenants yet, so nothing else claims this wildcard. This
# conflicts with reptrack-api-wildcard in reptrack-api-prod-deployment.yaml,
# which matches the same host pattern for the reptrack-api service; that
# Ingress must be removed/disabled or the two will fight over the same host.
# TLS reuses reptrack-wildcard-tls (already issued for *.reptrack.co.in by
# that prod Ingress) since it already covers this host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reptrack-staging-tenant-wildcard
  namespace: reptrack
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "*.reptrack.co.in"
      secretName: reptrack-wildcard-tls
  rules:
    - host: "*.reptrack.co.in"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reptrack-service
                port:
                  number: 80 
---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reptrack-service
  namespace: reptrack
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: reptrack-staging-root-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "staging.reptrack.co.in"
      secretName: reptrack-wildcard-tls
  rules:
    - host: "staging.reptrack.co.in"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reptrack-service
                port:
                  number: 80