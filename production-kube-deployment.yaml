apiVersion: v1
kind: ConfigMap
metadata:
  name: reptrack-hosts-config
  namespace: reptrack
data:
  zz_hosts.rb: |
    Rails.application.config.assume_ssl = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reptrack-api
  namespace: reptrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reptrack-api
  template:
    metadata:
      labels:
        app: reptrack-api
    spec:
      containers:
        - name: reptrack-api
          image: moindev/reptrack:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: reptrack-secrets
          env:
            - name: RAILS_ENV
              value: "production"
            - name: RAILS_SERVE_STATIC_FILES
              value: "true"
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: SMTP_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: ses-credentials
                  key: SMTP_ADDRESS
            - name: SMTP_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: ses-credentials
                  key: SMTP_USER_NAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ses-credentials
                  key: SMTP_PASSWORD
            - name: AR_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: encryption-keys
                  key: AR_ENCRYPTION_PRIMARY_KEY
            - name: AR_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: encryption-keys
                  key: AR_ENCRYPTION_DETERMINISTIC_KEY
            - name: AR_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: encryption-keys
                  key: AR_ENCRYPTION_KEY_DERIVATION_SALT
          volumeMounts:
            - name: hosts-config
              mountPath: /rails/config/initializers/zz_hosts.rb
              subPath: zz_hosts.rb
              readOnly: true
      volumes:
        - name: hosts-config
          configMap:
            name: reptrack-hosts-config
---
apiVersion: v1
kind: Service
metadata:
  name: reptrack-api
  namespace: reptrack
spec:
  selector:
    app: reptrack-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reptrack-api
  namespace: reptrack
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  rules:
    - host: api.reptrack.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reptrack-api
                port:
                  number: 80
  tls:
    - hosts:
        - api.reptrack.co.in